# Cloud Build: build the image and push it to Artifact Registry (asia-southeast1).
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${_TAG}", "-t", "${_IMAGE}:latest", "."]
images:
  - "${_IMAGE}:${_TAG}"
  - "${_IMAGE}:latest"
substitutions:
  _IMAGE: asia-southeast1-docker.pkg.dev/tesselle-demandfoundry/tesselle/app
  _TAG: manual
options:
  logging: CLOUD_LOGGING_ONLY
tags: ["tesselle"]
